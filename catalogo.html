<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo | Ferretería Wilmer</title>
  <meta name="description" content="Catálogo de productos por categoría.">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-white text-slate-800 antialiased">
  <header class="border-b">
    <div class="container py-4 flex items-center justify-between">
      <a href="/" class="font-semibold text-lg">Ferretería Wilmer</a>
      <nav class="hidden sm:flex gap-6">
        <a href="/#servicios" class="hover:underline">Servicios</a>
        <a href="/#ofertas" class="hover:underline">Ofertas</a>
        <a href="/#portafolio" class="hover:underline">Trabajos</a>
        <a href="/#contacto" class="hover:underline">Contacto</a>
      </nav>
      <a href="https://wa.me/51999999999" target="_blank" rel="noopener"
         class="inline-flex items-center rounded-lg border px-3 py-2 text-sm hover:bg-slate-50">
        Cotiza por WhatsApp
      </a>
    </div>
  </header>

  <!-- Hero de categoría (imagen y título cambian según ?cat=...) -->
  <section id="heroCat" class="bg-slate-50">
    <div class="container py-10 grid gap-6 md:grid-cols-2 items-center">
      <div>
        <h1 id="titleCat" class="text-3xl md:text-4xl font-bold leading-tight">Catálogo</h1>
        <p id="descCat" class="mt-3 text-slate-600">Explora los productos disponibles.</p>
      </div>
      <img id="imgCat" src="/media/hero/hero-1920.webp" alt="" class="rounded-xl shadow object-cover w-full h-64 md:h-80">
    </div>
  </section>

  <!-- Barra de búsqueda -->
  <section class="py-6 border-b">
    <div class="container flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <input id="q" type="search" placeholder="Buscar por nombre o descripción..."
             class="w-full border rounded-lg px-4 py-2 outline-none focus:ring focus:ring-slate-200">
      <span id="count" class="text-sm text-slate-500"></span>
    </div>
  </section>

  <!-- Listado -->
  <main class="py-10">
    <div class="container">
      <ul id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></ul>
      <p id="empty" class="hidden text-center text-slate-500">No se encontraron productos.</p>
    </div>
  </main>

  <footer class="border-t">
    <div class="container py-8 text-center text-xs text-slate-500">
      <a href="/" class="underline">← Volver al inicio</a>
    </div>
  </footer>

  <script type="module" src="/src/js/catalogo.js"></script>
</body>
</html>
